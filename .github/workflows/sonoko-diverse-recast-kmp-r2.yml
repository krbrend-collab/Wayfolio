name: SONOKO diverse recast Koori Maro Puchii round 2

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-diverse-recast-kmp-r2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate diverse recast auditions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-diverse-recast-kmp-r2
          python - <<'PY'
          import struct, shutil, subprocess
          import soundfile as sf
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='a')

          texts = {
              "Koori": (
                  "I know, I know. I was supposed to wait. "
                  "But you saw it too, right? The light moved. "
                  "Come on—just a little farther. "
                  "If this is a terrible idea, we can agree it was your idea."
              ),
              "Maro": (
                  "I wasn't hiding. I was standing somewhere unusually difficult to notice. "
                  "There is a difference. A very important difference. "
                  "Probably. "
                  "You can laugh. I already did, internally."
              ),
              "Puchii": (
                  "Wait, wait, wait—look! "
                  "I found it first. That means I get to name it. "
                  "No, I already have three names. "
                  "Come on! If we're going to do something ridiculous, we should at least do it quickly."
              ),
          }

          def pitch_wav(src, dst, semitones):
              shutil.copyfile(src, dst)
              factor = 2**(semitones/12)
              with open(dst, 'r+b') as f:
                  data = f.read()
                  i = data.find(b'fmt ')
                  sr_off = i + 12
                  br_off = i + 16
                  sr = struct.unpack('<I', data[sr_off:sr_off+4])[0]
                  br = struct.unpack('<I', data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack('<I', round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack('<I', round(br*factor)))

          def blend(parts):
              v = None
              for name, weight in parts:
                  emb = pipeline.load_voice(name) * weight
                  v = emb if v is None else v + emb
              return v

          configs = {
              # Completely new Koori lanes: no Eric/Michael dominant pair.
              "Koori": [
                  (1.085, +1.20, [('am_puck',0.82),('af_alloy',0.18)]),
                  (1.075, +1.50, [('am_liam',0.70),('af_alloy',0.30)]),
                  (1.080, +1.35, [('am_echo',0.58),('af_alloy',0.42)]),
                  (1.090, +1.90, [('af_alloy',0.72),('am_eric',0.28)]),
                  (1.082, +1.70, [('am_adam',0.52),('af_alloy',0.48)]),
              ],
              # Maro 3 from the previous round is the benchmark; these deliberately explore other identities.
              "Maro": [
                  (1.026, -0.60, [('af_nova',0.68),('am_echo',0.22),('af_bella',0.10)]),
                  (1.032, -0.50, [('af_nova',0.62),('am_puck',0.20),('af_bella',0.18)]),
                  (1.024, -0.80, [('af_jessica',0.52),('af_nova',0.33),('am_echo',0.15)]),
                  (1.018, -0.85, [('af_aoede',0.45),('af_nova',0.45),('am_echo',0.10)]),
              ],
              # Puchii 3 from the previous round is the benchmark; these widen timbre and energy.
              "Puchii": [
                  (1.120, +2.70, [('af_sky',0.55),('af_kore',0.35),('af_bella',0.10)]),
                  (1.112, +2.20, [('af_kore',0.62),('af_jessica',0.23),('af_sky',0.15)]),
                  (1.125, +2.80, [('af_bella',0.46),('af_sky',0.38),('af_kore',0.16)]),
                  (1.118, +2.45, [('af_kore',0.56),('af_alloy',0.22),('af_sky',0.22)]),
              ],
          }

          for char, char_configs in configs.items():
              for idx, (final_speed, pitch, parts) in enumerate(char_configs, 1):
                  factor = 2**(pitch/12)
                  gen_speed = final_speed / factor
                  voice = blend(parts)
                  audio = []
                  for r in pipeline(texts[char], voice=voice, speed=gen_speed):
                      audio.extend(r.audio.tolist())

                  raw = f'sonoko-diverse-recast-kmp-r2/raw_{char}_{idx}.wav'
                  pitched = f'sonoko-diverse-recast-kmp-r2/pitched_{char}_{idx}.wav'
                  out = f'sonoko-diverse-recast-kmp-r2/SONOKO_{char}_Diverse_R2_Option_{idx}.wav'
                  sf.write(raw, audio, 24000)
                  pitch_wav(raw, pitched, pitch)

                  if char == "Puchii":
                      # Nasal/bright shaping without phase-vocoder or doubling.
                      if idx == 1:
                          filt = "equalizer=f=420:t=q:w=1.0:g=-1.6,equalizer=f=1450:t=q:w=1.1:g=2.8,equalizer=f=2250:t=q:w=1.2:g=2.2,equalizer=f=3350:t=q:w=1.3:g=0.8,lowpass=f=9000,alimiter=limit=0.97"
                      elif idx == 2:
                          filt = "equalizer=f=360:t=q:w=1.0:g=-1.2,equalizer=f=1350:t=q:w=1.0:g=2.2,equalizer=f=2050:t=q:w=1.2:g=1.7,equalizer=f=3100:t=q:w=1.2:g=0.6,lowpass=f=9000,alimiter=limit=0.97"
                      elif idx == 3:
                          filt = "equalizer=f=450:t=q:w=1.0:g=-1.8,equalizer=f=1550:t=q:w=1.1:g=3.0,equalizer=f=2400:t=q:w=1.2:g=2.4,equalizer=f=3500:t=q:w=1.2:g=1.0,lowpass=f=9000,alimiter=limit=0.97"
                      else:
                          filt = "equalizer=f=400:t=q:w=1.0:g=-1.4,equalizer=f=1500:t=q:w=1.0:g=2.5,equalizer=f=2200:t=q:w=1.2:g=1.9,equalizer=f=3250:t=q:w=1.2:g=0.7,lowpass=f=9000,alimiter=limit=0.97"
                      subprocess.run(["ffmpeg","-y","-loglevel","error","-i",pitched,"-af",filt,out], check=True)
                  else:
                      shutil.copyfile(pitched, out)

          PY
          rm sonoko-diverse-recast-kmp-r2/raw_*.wav sonoko-diverse-recast-kmp-r2/pitched_*.wav

      - name: Upload diverse recast auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-diverse-recast-kmp-r2
          path: sonoko-diverse-recast-kmp-r2/*.wav
          retention-days: 7
