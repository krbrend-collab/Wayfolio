name: SONOKO Chapter 32 Expressive Dynamics

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-ch32-expressive-dynamics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate expressive-dynamics Chapter 32
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile numpy
          mkdir -p sonoko-ch32-dynamics/segments

          python - <<'PY'
          import re, struct, shutil, subprocess, json, math
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          OUT = Path("sonoko-ch32-dynamics")
          SEG = OUT / "segments"
          pipeline = KPipeline(lang_code='a')
          SR = 24000

          voices = {
              "Narrator": {"parts":[("am_echo",1.0)],"speed":1.0239075,"pitch":-0.60,"filters":"alimiter=limit=0.96"},
              "Koori": {"parts":[("af_alloy",0.72),("am_eric",0.28)],"speed":1.090,"pitch":1.90,"filters":"alimiter=limit=0.96"},
              "Amia": {"parts":[("af_heart",1.0)],"speed":1.035,"pitch":1.25,"filters":"alimiter=limit=0.96"},
              "Maro": {"parts":[("af_aoede",0.45),("af_nova",0.45),("am_echo",0.10)],"speed":1.188624944,"pitch":-0.95,"filters":"alimiter=limit=0.96"},
              "Pudding-Chan": {
                  "parts":[("af_sky",0.81),("af_bella",0.19)],"speed":1.095,"pitch":3.25,
                  "filters":"equalizer=f=820:t=q:w=0.8:g=1.8,equalizer=f=1250:t=q:w=0.9:g=2.4,equalizer=f=2050:t=q:w=1.1:g=0.8,equalizer=f=2600:t=q:w=1.2:g=0.8,equalizer=f=3300:t=q:w=1.2:g=-0.8,lowpass=f=8000,acompressor=threshold=-21dB:ratio=2.0:attack=10:release=75,alimiter=limit=0.96"
              },
              "Enishi": {"parts":[("am_echo",1.0)],"speed":0.990,"pitch":0.70,"filters":"alimiter=limit=0.96"},
              "Puchii": {
                  "parts":[("af_kore",0.68),("am_liam",0.32)],"speed":1.17935,"pitch":2.10,
                  "filters":"highpass=f=105,equalizer=f=1150:t=q:w=0.9:g=3.0,equalizer=f=1750:t=q:w=1.0:g=2.0,equalizer=f=2900:t=q:w=1.2:g=0.8,equalizer=f=420:t=q:w=1.0:g=-1.5,acompressor=threshold=-20dB:ratio=2.2:attack=8:release=65,lowpass=f=8500,alimiter=limit=0.96"
              },
          }

          S=[]
          def add(speaker,text,pause=180,tts=None,role="normal",gain=0.0,pace=1.0,focus=None,soft=None):
              S.append({
                  "speaker":speaker,"text":text,"pause":pause,"tts":tts or text,
                  "role":role,"gain":gain,"pace":pace,
                  "focus":focus or [],"soft":soft or []
              })

          add("Narrator","Chapter 32. Under the Sugar Maple.",650,"Chapter thirty-two. Under the Sugar Maple.",gain=-0.3)
          add("Narrator","The Sugar Maple knew when it was time for something good.",300,focus=[("something good",0.8)])
          add("Narrator","Its roots curved outward in wide arcs at the edge of town, forming natural seats where the road softened and the hill path toward Sonoyama-sama Shrine began.",180,focus=[("natural seats",0.7),("Sonoyama-sama Shrine",0.6)])
          add("Narrator","Light filtered through the leaves in loose, golden patches across the ring of water.",130,focus=[("loose, golden patches",0.7)])
          add("Narrator","Laughter, spoons tapping, and the soft fizz of popping candy filled the air.",300,focus=[("soft fizz",0.7)])
          add("Narrator","They gathered as friends, bowls settling wherever hands, paws, and flippers found space.",250,focus=[("as friends",0.7)])
          add("Narrator","Koori paused before sitting and placed one paw lightly against the bark.",110,soft=[("lightly",0.5)])
          add("Narrator","The maple had a comforting warmth beneath his pads.",120,focus=[("comforting warmth",0.8)])
          add("Narrator","He smiled and joined them.",360,soft=[("smiled",0.5)])

          add("Narrator","Maro leaned back first, already suspiciously pleased with himself.",90,focus=[("suspiciously pleased",0.6)])
          add("Narrator","His kakigōri glowed deep green beneath a glossy pour of matcha syrup, steam spreading faintly where it touched the ice.",90,focus=[("glowed deep green",0.7)],soft=[("steam spreading faintly",0.4)])
          add("Narrator","A single marshmallow sat proudly on top.",170,focus=[("proudly",0.8)])
          add("Maro","Observe,",90,"Observe.",gain=0.6,focus=[("Observe",1.2)])
          add("Narrator","he said.",150,role="tag")
          add("Narrator","Before anyone could ask, he reached into his bag and produced a small kitchen blowtorch.",130,focus=[("small kitchen blowtorch",1.0)])
          add("Narrator","Koori’s ears flicked up.",110,focus=[("flicked up",0.6)])
          add("Koori","Why do you have that?",210,focus=[("why",0.6)])
          add("Narrator","Maro flicked it on—fwoom—toasting the marshmallow to a perfect golden crust.",130,focus=[("fwoom",1.5),("perfect golden crust",0.8)])
          add("Maro","For emergencies,",75,"For emergencies—",gain=-0.1,focus=[("emergencies",0.7)])
          add("Narrator","he said, dead serious.",75,role="tag",focus=[("dead serious",0.4)])
          add("Maro","And texture.",260,focus=[("texture",1.0)])
          add("Narrator","Amia laughed as the sugar caramelized.",70,soft=[("laughed",0.4)])
          add("Amia","You carry that around?",170,focus=[("that",0.6)])
          add("Maro","Only on days that deserve it,",65,"Only on days that deserve it—",focus=[("deserve it",0.7)])
          add("Narrator","Maro replied, clicking it off and bowing to his dessert.",160,role="action_tag")
          add("Narrator","Puchii clapped once.",55,focus=[("once",0.5)])
          add("Puchii","That was a performance!",330,gain=0.5,focus=[("performance",1.8)])

          add("Narrator","Amia turned to her own bowl—soft green matcha layered with fresh strawberry slices that glistened against the ice, ramune candies nestled throughout like tiny glass beads.",100,focus=[("soft green matcha",0.5),("tiny glass beads",0.6)])
          add("Narrator","As she stirred, they clicked gently together.",90,soft=[("gently",0.4)])
          add("Amia","It tastes like summer,",70,"It tastes like summer—",soft=[("summer",0.4)])
          add("Narrator","she decided.",180,role="tag")
          add("Narrator","Pudding-Chan leaned in to examine it closely.",70,focus=[("closely",0.4)])
          add("Pudding-Chan","Very social flavor,",70,"Very social flavor—",focus=[("social",0.9)])
          add("Narrator","he decided.",120,role="tag")
          add("Narrator","She blinked.",50)
          add("Amia","Social?",160,focus=[("Social",0.7)])
          add("Pudding-Chan","Yes,",45,"Yes—",gain=0.3,focus=[("Yes",0.7)])
          add("Narrator","he said, nodding.",45,role="tag")
          add("Pudding-Chan","Good for sitting and talking. Not a ‘run-away’ snack.",320,focus=[("sitting and talking",0.8),("Not",0.7)],soft=[("run-away",0.3)])

          add("Narrator","Puchii burst out laughing and tipped his own bowl forward.",60,focus=[("burst out laughing",0.7)])
          add("Narrator","His shaved ice crackled with popping candy, red bean paste folded thickly through the center, kinako dusted warm and nutty across the top.",110,focus=[("crackled",0.7),("warm and nutty",0.6)])
          add("Puchii","Mine is loud,",45,"Mine is loud—",gain=0.4,focus=[("loud",1.4)])
          add("Narrator","he said proudly.",45,role="tag")
          add("Puchii","But also comforting.",180,soft=[("comforting",0.4)])
          add("Maro","It sounds like it’s applauding itself,",55,"It sounds like it’s applauding itself—",focus=[("applauding itself",0.9)])
          add("Narrator","Maro said.",100,role="tag")
          add("Puchii","It deserves it,",45,"It deserves it—",focus=[("deserves",1.0)])
          add("Narrator","Puchii replied.",210,role="tag")

          add("Narrator","Enishi lifted his bowl next.",70)
          add("Narrator","Black sesame syrup darkened the ice into something rich and grounding, kompeitō scattered across the surface like tiny stars caught mid-fall.",95,focus=[("rich and grounding",0.6),("tiny stars",0.7)])
          add("Narrator","He tasted it once.",230,soft=[("once",0.4)])
          add("Enishi","Balanced,",70,"Balanced.",soft=[("Balanced",0.4)])
          add("Narrator","he said.",170,role="tag")
          add("Narrator","Then, after a pause,",260,soft=[("after a pause",0.8)])
          add("Enishi","And cute.",340,focus=[("cute",0.7)])

          add("Narrator","Pudding-Chan looked at his own bowl, then brightened.",65,focus=[("brightened",0.6)])
          add("Narrator","His melon syrup shone translucent green over gently wobbling cucumber jelly.",90,focus=[("gently wobbling",0.6)])
          add("Pudding-Chan","See,",45,"See—",gain=0.3,focus=[("See",0.7)])
          add("Narrator","he said, tapping it once.",45,role="tag")
          add("Pudding-Chan","This is refreshing. But also friendly. You don’t rush with this one.",340,focus=[("refreshing",0.7),("friendly",1.0)],soft=[("don’t rush",0.5)])

          add("Narrator","Koori finally lifted his—yuzu folded cleanly into cream, a careful pinch of salt catching the light like frost.",100,focus=[("light like frost",0.7)])
          add("Narrator","He smiled softly to himself and took a quiet bite.",180,soft=[("softly",0.5),("quiet bite",0.6)])
          add("Narrator","The sharpness bloomed, then softened.",120,focus=[("bloomed",0.6)],soft=[("softened",0.5)])
          add("Narrator","He exhaled without realizing he’d been holding his breath.",220,soft=[("exhaled",0.6)])
          add("Koori","Yes,",55,"Yes—",soft=[("Yes",0.5)])
          add("Narrator","he said.",90,role="tag")
          add("Narrator","And after a moment, softer,",260,soft=[("softer",1.0)])
          add("Koori","This is right.",420,gain=-0.4,focus=[("right",0.6)])

          add("Narrator","They ate and reminisced, talking about vending machines near the bridge that somehow always had the right drink, the cherry-and-plum stream, and how blossoms would drift there again.",150,focus=[("right drink",0.5),("blossoms",0.5)])
          add("Narrator","Pudding-Chan was already planning winter snacks that involved warm places and sitting very still.",320,soft=[("warm places",0.5),("very still",0.6)])
          add("Pudding-Chan","At some point,",70,"At some point—",soft=[("At some point",0.4)])
          add("Narrator","Pudding-Chan said thoughtfully,",70,role="tag")
          add("Pudding-Chan","people need somewhere to put their bowls down.",230,focus=[("somewhere",0.7),("bowls down",0.5)])
          add("Narrator","Maro froze.",110,focus=[("froze",0.8)])
          add("Maro","That’s it.",150,gain=0.4,focus=[("it",1.1)])
          add("Amia","That’s… what?",170,soft=[("what",0.2)])
          add("Maro","Why we keep ending up here,",45,"Why we keep ending up here—",focus=[("here",0.6)])
          add("Narrator","Maro said, licking matcha from his thumb.",45,role="action_tag")
          add("Maro","We gather. We snack. We linger.",210,focus=[("gather",0.7),("snack",0.7),("linger",1.2)])
          add("Narrator","Puchii nodded.",45)
          add("Puchii","Lingering is important.",120,focus=[("important",1.0)])
          add("Pudding-Chan","It’s the best part,",45,"It’s the best part—",focus=[("best part",1.1)])
          add("Narrator","Pudding-Chan agreed.",210,role="tag")

          add("Narrator","Koori looked toward the slope beneath the torii, where the road trailed off and the shrine path continued upward.",110,soft=[("trailed off",0.4)])
          add("Narrator","From here, the vermilion gate framed the town just enough to remind it where it came from.",180,focus=[("remind it",0.5)])
          add("Koori","A place,",50,"A place—",soft=[("A place",0.3)])
          add("Narrator","he said gently,",55,role="tag")
          add("Koori","where this doesn’t stop when we stand up.",180,focus=[("doesn’t stop",0.8)])
          add("Narrator","Amia followed his gaze.",65,soft=[("followed his gaze",0.4)])
          add("Amia","A place that holds people when they arrive.",150,focus=[("holds people",0.8)])
          add("Pudding-Chan","And sends them back a little better fed,",45,"And sends them back a little better fed—",focus=[("better fed",0.9)])
          add("Narrator","Pudding-Chan added.",190,role="tag")

          add("Narrator","Maro snapped open his folding chalkboard, chalk squeaking immediately.",75,focus=[("snapped open",0.7),("squeaking immediately",0.5)])
          add("Puchii","Oh no,",45,"Oh no—",gain=0.3,focus=[("Oh no",0.7)])
          add("Narrator","Puchii said.",45,role="tag")
          add("Puchii","It’s happening.",180,focus=[("happening",1.0)])
          add("Narrator","Maro began sketching—fast, confident lines.",70,focus=[("fast, confident lines",0.8)])
          add("Narrator","A small building. Wide windows. Light that spilled outward instead of trapping itself inside.",130,focus=[("spilled outward",0.7)])
          add("Maro","No steps to hesitate on,",45,"No steps to hesitate on—",focus=[("No steps",0.5)])
          add("Narrator","he said.",45,role="tag")
          add("Maro","You just… enter.",160,focus=[("enter",0.8)])
          add("Narrator","Pudding-Chan pointed.",45)
          add("Pudding-Chan","Counter there. Jars where you can see the colors.",150,focus=[("see the colors",0.9)])
          add("Narrator","Puchii tapped the board rhythmically.",45)
          add("Puchii","It should hum when people are nearby.",170,focus=[("hum",1.0)])
          add("Narrator","Enishi stepped closer, gaze thoughtful.",60,soft=[("gaze thoughtful",0.4)])
          add("Enishi","And before the door,",45,"And before the door—",soft=[("before the door",0.3)])
          add("Narrator","he said,",45,role="tag")
          add("Enishi","a threshold. Something that lets attention align.",230,focus=[("threshold",1.1),("align",0.8)])

          add("Narrator","Maro drew a simple gate—small, vermilion, placed with care.",120,soft=[("placed with care",0.5)])
          add("Narrator","They all went quiet for a moment.",310,gain=-0.5,soft=[("quiet",0.7)])
          add("Narrator","Amia tilted her head.",55)
          add("Amia","Something about care,",45,"Something about care—",soft=[("care",0.4)])
          add("Narrator","she said.",45,role="tag")
          add("Amia","A place that’s watched over.",160,focus=[("watched over",0.7)])
          add("Enishi","Or named for who walked here first,",45,"Or named for who walked here first—",soft=[("walked here first",0.3)])
          add("Narrator","Enishi added.",45,role="tag")
          add("Enishi","Sonoyama-sama left places behind so others could rest.",200,focus=[("others could rest",0.7)])
          add("Narrator","Pudding-Chan nodded slowly.",70,soft=[("slowly",0.5)])
          add("Pudding-Chan","A name that feels like being remembered.",160,soft=[("remembered",0.3)])
          add("Narrator","Puchii grinned.",45)
          add("Puchii","Short,",45,"Short—",gain=0.3,focus=[("Short",0.7)])
          add("Narrator","he said.",45,role="tag")
          add("Puchii","Easy to say. Easy to come back to.",180,focus=[("come back",0.9)])

          add("Koori","And easy to find,",45,"And easy to find—",focus=[("find",0.7)])
          add("Narrator","Koori said.",50,role="tag")
          add("Narrator","His gaze moved to the path below the maple—the one he’d traveled and tended for three centuries.",95,focus=[("three centuries",0.6)])
          add("Koori","The path should be the invitation.",230,focus=[("invitation",1.0)])
          add("Narrator","Koori listened, tails tucked loosely around himself.",90,soft=[("loosely",0.4)])
          add("Narrator","The idea settled in his chest—steady and familiar, like a path he’d walked before and forgotten how to find again.",150,soft=[("steady and familiar",0.4)],focus=[("find again",0.5)])
          add("Narrator","A small smirk lifted the corner of his mouth.",170,focus=[("small smirk",0.5)])
          add("Koori","We can build it,",55,"We can build it—",focus=[("build it",0.8)])
          add("Narrator","he said.",70,role="tag")
          add("Koori","Tomorrow.",800,gain=0.2,focus=[("Tomorrow",1.3)])

          terms = [
              (r"Sonoyama-sama","[Sonoyama-sama](/sˈOnOjɑmɑ sˈɑmɑ/)"),
              (r"kakigōri","[kakigōri](/kɑkiɡˈOɹi/)"),
              (r"matcha","[matcha](/mˈɑtʃɑ/)"),
              (r"ramune","[ramune](/ɹɑmˈunɛ/)"),
              (r"kinako","[kinako](/kinˈɑkO/)"),
              (r"kompeitō","[kompeitō](/kOnpɛtˈO/)"),
              (r"yuzu","[yuzu](/jˈuzu/)"),
              (r"torii","[torii](/tˈOɹiˌi/)"),
              (r"Enishi","[Enishi](/ɛnˈiʃi/)"),
              (r"Pudding-Chan","[Pudding-Chan](/pˈʊdɪŋ tʃˈɑn/)"),
              (r"Puchii","[Puchii](/pˈutʃi/)"),
              (r"Koori","[Koori](/kˈuɹi/)"),
              (r"Amia","[Amia](/ˈɑmiɑ/)"),
              (r"Maro","[Maro](/mˈɑɹO/)"),
              (r"fwoom","[fwoom](/fwˈum/)"),
          ]

          def prep(text):
              t=text.replace("’","'").replace("‘","'").replace("“",'"').replace("”",'"')
              for pat,repl in terms:
                  t=re.sub(pat,repl,t)
              return t

          voice_cache={}
          def get_voice(parts):
              k=tuple(parts)
              if k in voice_cache: return voice_cache[k]
              v=None
              for name,w in parts:
                  e=pipeline.load_voice(name)*w
                  v=e if v is None else v+e
              voice_cache[k]=v
              return v

          def pitch_wav(src,dst,semitones):
              shutil.copyfile(src,dst)
              factor=2**(semitones/12)
              with open(dst,"r+b") as f:
                  data=f.read(); i=data.find(b"fmt ")
                  if i<0: raise RuntimeError("WAV fmt chunk not found")
                  sr_off=i+12; br_off=i+16
                  sr=struct.unpack("<I",data[sr_off:sr_off+4])[0]
                  br=struct.unpack("<I",data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack("<I",round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack("<I",round(br*factor)))

          def db_to_amp(db): return 10**(db/20)

          def norm_token(s):
              return re.sub(r"[^a-z0-9]+","",s.lower())

          def smooth_gain(audio,start,end,db,ramp_ms=25):
              if end<=start: return
              start=max(0,int(start)); end=min(len(audio),int(end))
              if end<=start: return
              target=db_to_amp(db)
              n=end-start
              ramp=min(int(SR*ramp_ms/1000),max(1,n//3))
              env=np.full(n,target,dtype=np.float32)
              if ramp>1:
                  env[:ramp]=np.linspace(1.0,target,ramp,dtype=np.float32)
                  env[-ramp:]=np.linspace(target,1.0,ramp,dtype=np.float32)
              audio[start:end]*=env

          def phrase_contour(audio,role):
              n=len(audio)
              if n < int(0.7*SR): return
              x=np.linspace(0,1,n,dtype=np.float32)
              if role=="tag":
                  db=-4.2 + 0.15*np.sin(np.pi*x)
              elif role=="action_tag":
                  db=-2.7 + 0.20*np.sin(np.pi*x)
              else:
                  # Subtle spoken contour: slight support in the body of the phrase,
                  # gentle release at the end instead of flat synthetic loudness.
                  db=(-0.20 + 0.45*np.sin(np.pi*x) - 0.35*np.clip((x-0.82)/0.18,0,1))
              audio *= np.power(10.0,db/20.0).astype(np.float32)

          def apply_word_dynamics(audio,tokens,items,sign=1):
              if not tokens or not items: return
              toks=[]
              for t in tokens:
                  txt=getattr(t,"text","") or ""
                  st=getattr(t,"start_ts",None); en=getattr(t,"end_ts",None)
                  if st is None or en is None: continue
                  nw=norm_token(txt)
                  if nw: toks.append((nw,float(st),float(en)))
              words=[x[0] for x in toks]
              for phrase,mag in items:
                  target=[norm_token(w) for w in re.findall(r"[A-Za-z0-9’'-]+",phrase) if norm_token(w)]
                  if not target: continue
                  m=len(target)
                  for i in range(0,len(words)-m+1):
                      if words[i:i+m]==target:
                          s=int(toks[i][1]*SR); e=int(toks[i+m-1][2]*SR)
                          smooth_gain(audio,s,e,sign*float(mag))

          rendered=[]; manifest=[]
          for idx,seg in enumerate(S,1):
              cfg=voices[seg["speaker"]]
              factor=2**(cfg["pitch"]/12)
              final_speed=cfg["speed"]*seg["pace"]
              if seg["role"]=="tag": final_speed*=1.105
              elif seg["role"]=="action_tag": final_speed*=1.055
              gen_speed=final_speed/factor
              voice=get_voice(cfg["parts"])
              tts=prep(seg["tts"])

              chunks=[]; token_groups=[]
              for r in pipeline(tts,voice=voice,speed=gen_speed):
                  y=np.asarray(r.audio,dtype=np.float32)
                  phrase_contour(y,seg["role"])
                  if seg["gain"]:
                      y*=db_to_amp(seg["gain"])
                  apply_word_dynamics(y,getattr(r,"tokens",None),seg["focus"],+1)
                  apply_word_dynamics(y,getattr(r,"tokens",None),seg["soft"],-1)
                  chunks.append(y)
              if not chunks: raise RuntimeError(f"No audio for segment {idx}")
              audio=np.concatenate(chunks)

              raw=SEG/f"{idx:03d}_raw.wav"
              pitched=SEG/f"{idx:03d}_pitched.wav"
              final=SEG/f"{idx:03d}_{seg['speaker'].replace(' ','_')}.wav"
              sf.write(raw,audio,SR,subtype="PCM_16")
              pitch_wav(raw,pitched,cfg["pitch"])
              subprocess.run([
                  "ffmpeg","-y","-loglevel","error","-i",str(pitched),
                  "-af",cfg["filters"],"-ar",str(SR),"-ac","1","-c:a","pcm_s16le",str(final)
              ],check=True)
              raw.unlink(missing_ok=True); pitched.unlink(missing_ok=True)
              rendered.append((final,seg["pause"]))
              manifest.append({
                  "index":idx,"speaker":seg["speaker"],"role":seg["role"],
                  "manuscript_text":seg["text"],"tts_prepared":tts,
                  "pause_after_ms":seg["pause"],"gain_db":seg["gain"],
                  "pace_multiplier":seg["pace"],"focus":seg["focus"],"soft":seg["soft"]
              })

          pieces=[]
          for f,pause_ms in rendered:
              y,sr=sf.read(f,dtype="float32")
              if y.ndim>1: y=y.mean(axis=1)
              pieces.append(y)
              if pause_ms: pieces.append(np.zeros(int(SR*pause_ms/1000),dtype=np.float32))
          mix=np.concatenate(pieces)
          peak=float(np.max(np.abs(mix))) if len(mix) else 1.0
          if peak>0.94: mix*=0.94/peak

          wav=OUT/"SONOKO_Chapter_32_Expressive_Dynamics.wav"
          sf.write(wav,mix,SR,subtype="PCM_16")
