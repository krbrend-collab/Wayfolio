          add("Koori","And easy to find,",45,"And easy to find—",focus=[("find",0.7)])
          add("Narrator","Koori said.",50,role="tag")
          add("Narrator","His gaze moved to the path below the maple—the one he’d traveled and tended for three centuries.",95,focus=[("three centuries",0.6)])
          add("Koori","The path should be the invitation.",230,focus=[("invitation",1.0)])
          add("Narrator","Koori listened, tails tucked loosely around himself.",90,soft=[("loosely",0.4)])
          add("Narrator","The idea settled in his chest—steady and familiar, like a path he’d walked before and forgotten how to find again.",150,soft=[("steady and familiar",0.4)],focus=[("find again",0.5)])
          add("Narrator","A small smirk lifted the corner of his mouth.",170,focus=[("small smirk",0.5)])
          add("Koori","We can build it,",55,"We can build it—",focus=[("build it",0.8)])
          add("Narrator","he said.",70,role="tag")
