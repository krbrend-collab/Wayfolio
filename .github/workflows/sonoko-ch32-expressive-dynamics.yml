          add("Narrator","Koori looked toward the slope beneath the torii, where the road trailed off and the shrine path continued upward.",110,soft=[("trailed off",0.4)])
          add("Narrator","From here, the vermilion gate framed the town just enough to remind it where it came from.",180,focus=[("remind it",0.5)])
