          terms = [
              (r"Sonoyama-sama","[Sonoyama-sama](/sˈOnOjɑmɑ sˈɑmɑ/)"),
              (r"kakigōri","[kakigōri](/kɑkiɡˈOɹi/)"),
              (r"matcha","[matcha](/mˈɑtʃɑ/)"),
              (r"ramune","[ramune](/ɹɑmˈunɛ/)"),
              (r"kinako","[kinako](/kinˈɑkO/)"),
              (r"kompeitō","[kompeitō](/kOnpɛtˈO/)"),
              (r"yuzu","[yuzu](/jˈuzu/)"),
              (r"torii","[torii](/tˈOɹiˌi/)"),
              (r"Enishi","[Enishi](/ɛnˈiʃi/)"),
              (r"Pudding-Chan","[Pudding-Chan](/pˈʊdɪŋ tʃˈɑn/)"),
              (r"Puchii","[Puchii](/pˈutʃi/)"),
              (r"Koori","[Koori](/kˈuɹi/)"),
              (r"Amia","[Amia](/ˈɑmiɑ/)"),
              (r"Maro","[Maro](/mˈɑɹO/)"),
              (r"fwoom","[fwoom](/fwˈum/)"),
          ]

          def prep(text):
              t=text.replace("’","'").replace("‘","'").replace("“",'"').replace("”",'"')
              for pat,repl in terms:
                  t=re.sub(pat,repl,t)
              return t

          voice_cache={}
          def get_voice(parts):
              k=tuple(parts)
              if k in voice_cache: return voice_cache[k]
              v=None
              for name,w in parts:
                  e=pipeline.load_voice(name)*w
                  v=e if v is None else v+e
              voice_cache[k]=v
              return v

          def pitch_wav(src,dst,semitones):
              shutil.copyfile(src,dst)
              factor=2**(semitones/12)
              with open(dst,"r+b") as f:
                  data=f.read(); i=data.find(b"fmt ")
                  if i<0: raise RuntimeError("WAV fmt chunk not found")
                  sr_off=i+12; br_off=i+16
                  sr=struct.unpack("<I",data[sr_off:sr_off+4])[0]
                  br=struct.unpack("<I",data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack("<I",round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack("<I",round(br*factor)))

          def db_to_amp(db): return 10**(db/20)

          def norm_token(s):
              return re.sub(r"[^a-z0-9]+","",s.lower())

          def smooth_gain(audio,start,end,db,ramp_ms=25):
              if end<=start: return
              start=max(0,int(start)); end=min(len(audio),int(end))
              if end<=start: return
              target=db_to_amp(db)
              n=end-start
              ramp=min(int(SR*ramp_ms/1000),max(1,n//3))
              env=np.full(n,target,dtype=np.float32)
              if ramp>1:
                  env[:ramp]=np.linspace(1.0,target,ramp,dtype=np.float32)
                  env[-ramp:]=np.linspace(target,1.0,ramp,dtype=np.float32)
              audio[start:end]*=env

          def phrase_contour_post(audio, role, speaker, punct="", unit_index=0):
              """Post-filter dynamics so voice compressors cannot flatten the acting."""
              n=len(audio)
              if n < int(0.20*SR): return
              x=np.linspace(0,1,n,dtype=np.float32)

              if speaker=="Narrator":
                  if role=="action_tag":
                      db=-1.8 + 0.25*np.sin(np.pi*x)
                  else:
                      # Narrator remains comparatively restrained.
                      db=-0.15 + 0.35*np.sin(np.pi*x) - 0.30*np.clip((x-0.84)/0.16,0,1)
              else:
                  # Cartoon-character delivery: substantially wider loudness motion.
                  phase=(unit_index % 3)*0.75
                  db=(-0.45
                      + 1.55*np.sin(np.pi*x)
                      + 0.50*np.sin(2*np.pi*x + phase)
                      - 1.00*np.clip((x-0.82)/0.18,0,1))
                  if punct=="?":
                      # Questions visibly rise in energy into the end.
                      db += -0.45 + 2.65*(x**2)
                  elif punct=="!":
                      # Exclamations attack hard, then release.
                      db += 1.85*(1.0 - 0.70*x)
                  elif punct=="…":
                      # Ellipses visibly fall away.
                      db += -1.70*x
                  elif punct=="—":
                      db += 0.65*(1.0-x) - 0.35*x
                  elif punct==",":
                      db += 0.30*np.sin(np.pi*x)
              audio *= np.power(10.0,db/20.0).astype(np.float32)

          def apply_word_dynamics_post(audio, token_rows, items, sign, speaker, time_scale=1.0):
              if not token_rows or not items: return
              toks=[]
              for txt,st,en in token_rows:
                  nw=norm_token(txt)
                  if nw:
                      toks.append((nw,float(st)*time_scale,float(en)*time_scale))
              words=[x[0] for x in toks]
              if speaker=="Narrator":
                  strength=0.70
              else:
                  # Much stronger than the prior pass, and applied after compression.
                  strength=2.80 if sign>0 else 2.15
              for phrase,mag in items:
                  target=[norm_token(w) for w in re.findall(r"[A-Za-z0-9’'-]+",phrase) if norm_token(w)]
                  if not target: continue
                  m=len(target)
                  for i in range(0,len(words)-m+1):
                      if words[i:i+m]==target:
                          s=int(toks[i][1]*SR); e=int(toks[i+m-1][2]*SR)
                          smooth_gain(audio,s,e,sign*float(mag)*strength,ramp_ms=18)

          def split_dialogue_units(text):
              """Keep punctuation attached to each spoken unit so Kokoro hears it."""
              text=text.strip()
              if not text: return []
              parts=re.findall(r".*?(?:…|[.!?;:,—]|$)",text,flags=re.S)
              return [p.strip() for p in parts if p and p.strip()]

          def final_punct(text):
              t=text.rstrip()
              m=re.search(r"(…|[.!?;:,—])(?:['\"])?$",t)
              return m.group(1) if m else ""

          def dramatic_params(punct, unit_index, total_units):
              pitch=0.0; speed=1.0
              if punct=="?":
                  pitch += 0.38; speed *= 0.985
              elif punct=="!":
                  pitch += 0.28; speed *= 1.035
              elif punct=="…":
                  pitch -= 0.28; speed *= 0.925
              elif punct=="—":
                  pitch += 0.10; speed *= 0.975
              elif punct==",":
                  pitch += 0.05
              elif punct==".":
                  pitch -= 0.10; speed *= 0.99
              if total_units>1:
                  pitch += (0.10 if unit_index % 2 == 0 else -0.08)
              return pitch,speed

          def punctuation_pause_ms(punct):
              return {
                  ",": 95,
                  "—": 175,
                  ";": 170,
                  ":": 150,
                  "…": 360,
                  "?": 235,
                  "!": 180,
                  ".": 190,
              }.get(punct,80)

          rendered=[]; manifest=[]
          for idx,seg in enumerate(S,1):
              # Pure speech-attribution / vocal-direction text is performed, not spoken.
              if seg["role"]=="tag":
                  rendered.append((None,seg["pause"]))
                  manifest.append({
                      "index":idx,"speaker":seg["speaker"],"role":seg["role"],
                      "manuscript_text":seg["text"],"spoken":False,
                      "performance_direction_absorbed":True,
                      "pause_after_ms":seg["pause"]
                  })
                  continue

              cfg=voices[seg["speaker"]]
              voice=get_voice(cfg["parts"])
              is_character=seg["speaker"]!="Narrator"
              source_units=split_dialogue_units(seg["tts"]) if is_character else [seg["tts"]]
              seg_pieces=[]
              unit_manifest=[]

              for uidx,unit_text in enumerate(source_units):
                  punct=final_punct(unit_text)
                  total_units=len(source_units)
                  local_pitch=0.0
                  local_speed=1.0
                  if is_character:
                      local_pitch,local_speed=dramatic_params(punct,uidx,total_units)

                  total_pitch=cfg["pitch"]+local_pitch
                  factor=2**(total_pitch/12)
                  final_speed=cfg["speed"]*seg["pace"]*local_speed
                  if seg["role"]=="action_tag":
                      final_speed*=1.045
                  gen_speed=final_speed/factor

                  tts=prep(unit_text)
                  chunks=[]
                  token_rows=[]
                  pre_offset=0.0
                  for r in pipeline(tts,voice=voice,speed=gen_speed):
                      y=np.asarray(r.audio,dtype=np.float32)
                      for tok in (getattr(r,"tokens",None) or []):
                          st=getattr(tok,"start_ts",None); en=getattr(tok,"end_ts",None)
                          if st is not None and en is not None:
                              token_rows.append((getattr(tok,"text","") or "",float(st)+pre_offset,float(en)+pre_offset))
                      chunks.append(y)
                      pre_offset += len(y)/SR
                  if not chunks: raise RuntimeError(f"No audio for segment {idx} unit {uidx}")
                  audio=np.concatenate(chunks)

                  raw=SEG/f"{idx:03d}_{uidx:02d}_raw.wav"
                  pitched=SEG/f"{idx:03d}_{uidx:02d}_pitched.wav"
                  filtered=SEG/f"{idx:03d}_{uidx:02d}_filtered.wav"
                  sf.write(raw,audio,SR,subtype="PCM_16")
                  pitch_wav(raw,pitched,total_pitch)
                  subprocess.run([
                      "ffmpeg","-y","-loglevel","error","-i",str(pitched),
                      "-af",cfg["filters"],"-ar",str(SR),"-ac","1","-c:a","pcm_s16le",str(filtered)
                  ],check=True)

                  y,sr=sf.read(filtered,dtype="float32")
                  if y.ndim>1: y=y.mean(axis=1)

                  # Acting dynamics happen AFTER the voice's compressor/EQ.
                  phrase_contour_post(y,seg["role"],seg["speaker"],punct,uidx)
                  if seg["gain"]:
                      y*=db_to_amp(seg["gain"])
                  apply_word_dynamics_post(y,token_rows,seg["focus"],+1,seg["speaker"],1.0/factor)
                  apply_word_dynamics_post(y,token_rows,seg["soft"],-1,seg["speaker"],1.0/factor)

                  peak=float(np.max(np.abs(y))) if len(y) else 0.0
                  if peak>0.975:
                      y*=0.975/peak
                  seg_pieces.append(y)

                  # Make punctuation audible as timing, not merely a glyph Kokoro may glide over.
                  if is_character and uidx < total_units-1:
                      seg_pieces.append(np.zeros(int(SR*punctuation_pause_ms(punct)/1000),dtype=np.float32))

                  unit_manifest.append({
                      "unit":uidx+1,"text":unit_text,"tts_prepared":tts,
                      "punctuation":punct,"local_pitch_semitones":local_pitch,
                      "local_speed_multiplier":local_speed
                  })
                  raw.unlink(missing_ok=True); pitched.unlink(missing_ok=True); filtered.unlink(missing_ok=True)

              audio=np.concatenate(seg_pieces) if seg_pieces else np.zeros(1,dtype=np.float32)
              final=SEG/f"{idx:03d}_{seg['speaker'].replace(' ','_')}.wav"
              sf.write(final,audio,SR,subtype="PCM_16")
              rendered.append((final,seg["pause"]))
              manifest.append({
                  "index":idx,"speaker":seg["speaker"],"role":seg["role"],
                  "manuscript_text":seg["text"],"spoken":True,
                  "pause_after_ms":seg["pause"],"gain_db":seg["gain"],
                  "pace_multiplier":seg["pace"],"focus":seg["focus"],"soft":seg["soft"],
                  "units":unit_manifest
              })

          pieces=[]
          for f,pause_ms in rendered:
              if f is not None:
                  y,sr=sf.read(f,dtype="float32")
                  if y.ndim>1: y=y.mean(axis=1)
                  pieces.append(y)
              if pause_ms: pieces.append(np.zeros(int(SR*pause_ms/1000),dtype=np.float32))
          mix=np.concatenate(pieces)
          peak=float(np.max(np.abs(mix))) if len(mix) else 1.0
          if peak>0.94: mix*=0.94/peak

          wav=OUT/"SONOKO_Chapter_32_Dramatic_Cartoon_v2.wav"
          sf.write(wav,mix,SR,subtype="PCM_16")
          subprocess.run(["ffmpeg","-y","-loglevel","error","-i",str(wav),"-af","loudnorm=I=-18:TP=-2:LRA=15","-c:a","aac","-b:a","192k",str(OUT/"SONOKO_Chapter_32_Dramatic_Cartoon_v2.m4a")],check=True)
          subprocess.run(["ffmpeg","-y","-loglevel","error","-i",str(wav),"-af","loudnorm=I=-18:TP=-2:LRA=15","-c:a","libmp3lame","-b:a","192k",str(OUT/"SONOKO_Chapter_32_Dramatic_Cartoon_v2.mp3")],check=True)
          (OUT/"chapter32_dramatic_cartoon_v2_manifest.json").write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding="utf-8")
          PY

      - name: Upload dramatic cartoon chapter V2
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-ch32-dramatic-cartoon-v2
          path: |
            sonoko-ch32-dynamics/SONOKO_Chapter_32_Dramatic_Cartoon_v2.wav
            sonoko-ch32-dynamics/SONOKO_Chapter_32_Dramatic_Cartoon_v2.m4a
            sonoko-ch32-dynamics/SONOKO_Chapter_32_Dramatic_Cartoon_v2.mp3
            sonoko-ch32-dynamics/chapter32_dramatic_cartoon_v2_manifest.json
          retention-days: 7
