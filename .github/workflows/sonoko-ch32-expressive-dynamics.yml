          add("Narrator","Amia tilted her head.",55)
          add("Amia","Something about care,",45,"Something about care—",soft=[("care",0.4)])
          add("Narrator","she said.",45,role="tag")
          add("Amia","A place that’s watched over.",160,focus=[("watched over",0.7)])
          add("Enishi","Or named for who walked here first,",45,"Or named for who walked here first—",soft=[("walked here first",0.3)])
          add("Narrator","Enishi added.",45,role="tag")
          add("Enishi","Sonoyama-sama left places behind so others could rest.",200,focus=[("others could rest",0.7)])
          add("Narrator","Pudding-Chan nodded slowly.",70,soft=[("slowly",0.5)])
