name: SONOKO Chapter 32 Dramatic Cartoon Dynamics V2

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-ch32-expressive-dynamics.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dramatic cartoon Chapter 32 V2
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile numpy
          mkdir -p sonoko-ch32-dynamics/segments

