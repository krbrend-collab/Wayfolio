name: SONOKO Maro auditions round 1

on:
  push:
    branches:
      - sonoko-auditions-host
    paths:
      - .github/workflows/sonoko-maro-auditions-round1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate four distinct Maro auditions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p sonoko-maro-r1
          python - <<'PY'
          import json, pathlib, requests, struct

          TEXT = "You weren’t supposed to see that. That’s… unhelpful. Don’t look at me like that. Nope. Passing through. I nudge things. And sometimes apparently I become a wheel. That was new. That’s a poetic way of saying ‘compulsive meddler.’ It’s easier to be the funny stranger. People don’t expect anything real from a stranger. I don’t want to be the problem. Please don’t grow extra limbs. The festival committee will have to make a whole new safety poster. That’s boba. Great for when you want to think about something, and also when you don’t. With better… feet. You do have feet, right? Good enough."
          BASE = "https://nymbo-tools.hf.space/gradio_api/call/Generate_Speech"
          CANDIDATES = [
              {"option": 1, "voice": "am_echo", "final_speed": 1.045, "pitch": 0.45},
              {"option": 2, "voice": "am_liam", "final_speed": 1.035, "pitch": 0.70},
              {"option": 3, "voice": "am_puck", "final_speed": 1.055, "pitch": -0.10},
              {"option": 4, "voice": "af_sky", "final_speed": 1.020, "pitch": -1.40},
          ]

          def parse_complete(s):
              for block in s.replace('\r\n','\n').split('\n\n'):
                  event=None; data=[]
                  for line in block.split('\n'):
                      if line.startswith('event:'): event=line[6:].strip()
                      elif line.startswith('data:'): data.append(line[5:].strip())
                  if event == 'error' and data: raise RuntimeError('Nymbo error: '+'\n'.join(data))
                  if event == 'complete' and data: return json.loads('\n'.join(data))
              raise RuntimeError('No complete event')

          def find_url(v):
              if isinstance(v,str): return v if v.startswith(('http://','https://')) else None
              if isinstance(v,list):
                  for x in v:
                      u=find_url(x)
                      if u:return u
              if isinstance(v,dict):
                  if isinstance(v.get('url'),str) and v['url'].startswith(('http://','https://')): return v['url']
                  for x in v.values():
                      u=find_url(x)
                      if u:return u
              return None

          def pitch_header(raw, semitones):
              if abs(semitones) < 1e-8: return raw
              b=bytearray(raw); factor=2**(semitones/12)
              pos=12
              while pos+8 <= len(b):
                  cid=bytes(b[pos:pos+4]); size=struct.unpack_from('<I',b,pos+4)[0]
                  if cid == b'fmt ':
                      sr=struct.unpack_from('<I',b,pos+12)[0]
                      br=struct.unpack_from('<I',b,pos+16)[0]
                      struct.pack_into('<I',b,pos+12,max(1,round(sr*factor)))
                      struct.pack_into('<I',b,pos+16,max(1,round(br*factor)))
                      return bytes(b)
                  pos += 8 + size + (size & 1)
              return bytes(b)

          for c in CANDIDATES:
              factor=2**(c['pitch']/12)
              generation_speed=c['final_speed']/factor
              r=requests.post(BASE,json={"data":[TEXT,generation_speed,c['voice']]},timeout=90); r.raise_for_status()
              event_id=r.json().get('event_id')
              if not event_id: raise RuntimeError(f"No event id for option {c['option']}")
              rr=requests.get(f"{BASE}/{event_id}",headers={"Accept":"text/event-stream"},timeout=240); rr.raise_for_status()
              url=find_url(parse_complete(rr.text))
              if not url: raise RuntimeError(f"No audio URL for option {c['option']}")
              ar=requests.get(url,timeout=120); ar.raise_for_status()
              audio=pitch_header(ar.content,c['pitch'])
              pathlib.Path(f"sonoko-maro-r1/SONOKO_Maro_Option_{c['option']}.wav").write_bytes(audio)
          PY

      - name: Upload Maro auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-maro-round1
          path: sonoko-maro-r1/*.wav
          retention-days: 7
