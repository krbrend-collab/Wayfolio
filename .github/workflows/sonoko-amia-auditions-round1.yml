name: SONOKO Amia auditions round 1

on:
  push:
    branches:
      - sonoko-auditions-host
    paths:
      - .github/workflows/sonoko-amia-auditions-round1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate four distinct Amia auditions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p sonoko-amia-r1
          python - <<'PY'
          import json, pathlib, requests

          TEXT = "Some nights are harder to sort out than others. Because of too many feelings at the same time. Sometimes I can tell where something begins inside a person—the first hurt, or the hope under the hurt. And sometimes it all comes at once: the grief, the love, the wanting, the fear of wanting. I like having you here. I want you to stay with us more often. I like having you around. I want to see you because you're you. I want this to be joyful, not just useful. I want to sing because it feels good. Even if it sparkles?"
          BASE = "https://nymbo-tools.hf.space/gradio_api/call/Generate_Speech"
          CANDIDATES = [
              {"option": 1, "voice": "af_heart",   "speed": 1.035},
              {"option": 2, "voice": "af_sky",     "speed": 1.045},
              {"option": 3, "voice": "af_nova",    "speed": 1.035},
              {"option": 4, "voice": "af_jessica", "speed": 1.025},
          ]

          def parse_complete(s):
              for block in s.replace('\r\n','\n').split('\n\n'):
                  event=None; data=[]
                  for line in block.split('\n'):
                      if line.startswith('event:'): event=line[6:].strip()
                      elif line.startswith('data:'): data.append(line[5:].strip())
                  if event == 'error' and data:
                      raise RuntimeError('Nymbo error: ' + '\n'.join(data))
                  if event == 'complete' and data:
                      return json.loads('\n'.join(data))
              raise RuntimeError('No complete event')

          def find_url(v):
              if isinstance(v,str):
                  return v if v.startswith(('http://','https://')) else None
              if isinstance(v,list):
                  for x in v:
                      u=find_url(x)
                      if u: return u
              if isinstance(v,dict):
                  if isinstance(v.get('url'),str) and v['url'].startswith(('http://','https://')):
                      return v['url']
                  for x in v.values():
                      u=find_url(x)
                      if u: return u
              return None

          for c in CANDIDATES:
              r=requests.post(BASE,json={"data":[TEXT,c['speed'],c['voice']]},timeout=90)
              r.raise_for_status()
              event_id=r.json().get('event_id')
              if not event_id: raise RuntimeError(f"No event_id for option {c['option']}")
              rr=requests.get(f"{BASE}/{event_id}",headers={"Accept":"text/event-stream"},timeout=240)
              rr.raise_for_status()
              url=find_url(parse_complete(rr.text))
              if not url: raise RuntimeError(f"No audio URL for option {c['option']}")
              ar=requests.get(url,timeout=120); ar.raise_for_status()
              pathlib.Path(f"sonoko-amia-r1/SONOKO_Amia_Option_{c['option']}.wav").write_bytes(ar.content)
          PY

      - name: Upload Amia auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-amia-round1
          path: sonoko-amia-r1/*.wav
          retention-days: 7
