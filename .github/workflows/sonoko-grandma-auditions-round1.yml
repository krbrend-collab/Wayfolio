name: SONOKO Grandma auditions round 1

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-grandma-auditions-round1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Grandma auditions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-grandma-r1
          python - <<'PY'
          import struct, shutil
          import soundfile as sf
          from kokoro import KPipeline

          pipeline=KPipeline(lang_code='a')
          text="You don't have to hurry. The tea will still be warm when you get here. Sit down and tell me what happened—start wherever you like. And if you tell me you weren't hungry, I'll know you're lying."

          def pitch_wav(src,dst,semitones):
              shutil.copyfile(src,dst)
              factor=2**(semitones/12)
              with open(dst,'r+b') as f:
                  data=f.read()
                  i=data.find(b'fmt ')
                  sr_off=i+12; br_off=i+16
                  sr=struct.unpack('<I',data[sr_off:sr_off+4])[0]
                  br=struct.unpack('<I',data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack('<I',round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack('<I',round(br*factor)))

          configs=[
              ('af_sarah',0.985,-0.25),
              ('af_nicole',0.975,-0.45),
              ('af_river',0.990,-0.15),
              ('af_alloy',0.980,-0.35),
          ]

          for i,(voice,final_speed,pitch) in enumerate(configs,1):
              factor=2**(pitch/12)
              gen_speed=final_speed/factor
              audio=[]
              for r in pipeline(text,voice=voice,speed=gen_speed):
                  audio.extend(r.audio.tolist())
              raw=f'sonoko-grandma-r1/raw_{i}.wav'
              out=f'sonoko-grandma-r1/SONOKO_Grandma_Option_{i}.wav'
              sf.write(raw,audio,24000)
              pitch_wav(raw,out,pitch)
          PY
          rm sonoko-grandma-r1/raw_*.wav
      - name: Upload Grandma auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-grandma-round1
          path: sonoko-grandma-r1/*.wav
          retention-days: 7
