name: SONOKO Puchii Vanellope-inspired and Pudding duck-separation auditions

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-puchii-pudding-separation-r4.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate separation auditions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-puchii-pudding-r4

          python - <<'PY'
          import struct, shutil, subprocess
          import soundfile as sf
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='a')

          TEXT_PUCHII = (
              "Wait, wait—look! I found it first. That means I get to name it. "
              "No, I already have three names. Come on! If we're going to do something ridiculous, "
              "we should at least do it quickly."
          )
          TEXT_PUDDING = (
              "I found the good one! Look, look—this part is colder. No, wait. This part. "
              "Definitely this part. I knew it! Can we keep it? Please? "
              "I promise I will be extremely responsible. Probably."
          )

          def blend(parts):
              v = None
              for name, w in parts:
                  e = pipeline.load_voice(name) * w
                  v = e if v is None else v + e
              return v

          def pitch_wav(src, dst, semitones):
              shutil.copyfile(src, dst)
              factor = 2**(semitones/12)
              with open(dst, 'r+b') as f:
                  data = f.read()
                  i = data.find(b'fmt ')
                  sr_off = i + 12
                  br_off = i + 16
                  sr = struct.unpack('<I', data[sr_off:sr_off+4])[0]
                  br = struct.unpack('<I', data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack('<I', round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack('<I', round(br*factor)))

          # Puchii: quicker, congested/nasal, scrappy, slightly rough.
          # Deliberately avoids af_sky / af_bella so Pudding-Chan owns that family.
          puchii = [
              {
                "parts":[("af_kore",0.68),("am_liam",0.32)],
                "speed":1.145, "pitch":2.10,
                "filt":"highpass=f=105,equalizer=f=1150:t=q:w=0.9:g=3.0,equalizer=f=1750:t=q:w=1.0:g=2.0,equalizer=f=2900:t=q:w=1.2:g=0.8,equalizer=f=420:t=q:w=1.0:g=-1.5,acompressor=threshold=-20dB:ratio=2.2:attack=8:release=65,lowpass=f=8500,alimiter=limit=0.97"
              },
              {
                "parts":[("af_alloy",0.58),("am_puck",0.42)],
                "speed":1.155, "pitch":1.95,
                "filt":"highpass=f=110,equalizer=f=1250:t=q:w=0.9:g=3.2,equalizer=f=1900:t=q:w=1.0:g=2.2,equalizer=f=3100:t=q:w=1.2:g=0.7,equalizer=f=480:t=q:w=1.0:g=-1.4,acompressor=threshold=-21dB:ratio=2.5:attack=6:release=55,lowpass=f=8200,alimiter=limit=0.97"
              },
              {
                "parts":[("am_puck",0.50),("af_jessica",0.50)],
                "speed":1.150, "pitch":2.05,
                "filt":"highpass=f=110,equalizer=f=1080:t=q:w=0.9:g=2.7,equalizer=f=1650:t=q:w=1.0:g=2.4,equalizer=f=2700:t=q:w=1.2:g=1.0,equalizer=f=380:t=q:w=1.0:g=-1.6,acompressor=threshold=-20dB:ratio=2.4:attack=7:release=60,lowpass=f=8300,alimiter=limit=0.97"
              },
              {
                "parts":[("af_kore",0.52),("af_alloy",0.28),("am_puck",0.20)],
                "speed":1.160, "pitch":2.25,
                "filt":"highpass=f=110,equalizer=f=1200:t=q:w=0.85:g=3.4,equalizer=f=1850:t=q:w=1.0:g=2.1,equalizer=f=3000:t=q:w=1.2:g=0.9,equalizer=f=450:t=q:w=1.0:g=-1.7,acompressor=threshold=-20dB:ratio=2.3:attack=6:release=55,lowpass=f=8400,alimiter=limit=0.97"
              },
          ]

          # Pudding-Chan: preserve the selected Sky/Bella family, slightly slower/lower,
          # with three amounts of a rounded "duck-like" quacky resonance.
          pudding = [
              {
                "parts":[("af_sky",0.81),("af_bella",0.19)],
                "speed":1.095, "pitch":2.95,
                "filt":"equalizer=f=820:t=q:w=0.8:g=1.8,equalizer=f=1250:t=q:w=0.9:g=2.4,equalizer=f=2050:t=q:w=1.1:g=0.8,equalizer=f=3300:t=q:w=1.2:g=-0.8,lowpass=f=8000,acompressor=threshold=-21dB:ratio=2.0:attack=10:release=75,alimiter=limit=0.97"
              },
              {
                "parts":[("af_sky",0.81),("af_bella",0.19)],
                "speed":1.090, "pitch":2.85,
                "filt":"equalizer=f=760:t=q:w=0.8:g=2.2,equalizer=f=1180:t=q:w=0.9:g=3.1,equalizer=f=1950:t=q:w=1.1:g=1.0,equalizer=f=3200:t=q:w=1.2:g=-1.1,lowpass=f=7800,acompressor=threshold=-21dB:ratio=2.2:attack=9:release=70,alimiter=limit=0.97"
              },
              {
                "parts":[("af_sky",0.81),("af_bella",0.19)],
                "speed":1.085, "pitch":2.75,
                "filt":"equalizer=f=720:t=q:w=0.8:g=2.5,equalizer=f=1120:t=q:w=0.9:g=3.7,equalizer=f=1850:t=q:w=1.1:g=1.2,equalizer=f=3100:t=q:w=1.2:g=-1.3,lowpass=f=7600,acompressor=threshold=-21dB:ratio=2.3:attack=8:release=68,alimiter=limit=0.97"
              },
          ]

          def render(group, text, options):
              for idx,cfg in enumerate(options,1):
                  factor = 2**(cfg["pitch"]/12)
                  gen_speed = cfg["speed"]/factor
                  voice = blend(cfg["parts"])
                  audio=[]
                  for r in pipeline(text, voice=voice, speed=gen_speed):
                      audio.extend(r.audio.tolist())
                  raw=f"sonoko-puchii-pudding-r4/{group}_raw_{idx}.wav"
                  pitched=f"sonoko-puchii-pudding-r4/{group}_pitched_{idx}.wav"
                  out=f"sonoko-puchii-pudding-r4/SONOKO_{group}_Separation_R4_Option_{idx}.wav"
                  sf.write(raw,audio,24000)
                  pitch_wav(raw,pitched,cfg["pitch"])
                  subprocess.run([
                      "ffmpeg","-y","-loglevel","error","-i",pitched,
                      "-af",cfg["filt"],"-ar","24000","-ac","1","-c:a","pcm_s16le",out
                  ],check=True)

          render("Puchii", TEXT_PUCHII, puchii)
          render("PuddingChan", TEXT_PUDDING, pudding)
          PY

          rm sonoko-puchii-pudding-r4/*_raw_*.wav sonoko-puchii-pudding-r4/*_pitched_*.wav

      - name: Upload auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-puchii-pudding-separation-r4
          path: sonoko-puchii-pudding-r4/*.wav
          retention-days: 7
