name: SONOKO Pudding-Chan Toad-like auditions round 2

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-puddingchan-toadlike-round2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Pudding-Chan auditions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-puddingchan-r2
          python - <<'PY'
          import wave, struct, shutil
          import soundfile as sf
          from kokoro import KPipeline

          pipeline=KPipeline(lang_code='a')
          text="I found it! I found the good one! Look, look—this part is colder. No, wait! This part. Definitely this part. I knew it! I could feel it in my whole body. Can we keep it? Please? I promise I will be extremely responsible. Probably!"

          def pitch_wav(src,dst,semitones):
              shutil.copyfile(src,dst)
              factor=2**(semitones/12)
              with open(dst,'r+b') as f:
                  data=f.read()
                  i=data.find(b'fmt ')
                  if i < 0: return
                  sr_off=i+12
                  br_off=i+16
                  sr=struct.unpack('<I',data[sr_off:sr_off+4])[0]
                  br=struct.unpack('<I',data[br_off:br_off+4])[0]
                  nsr=max(1,round(sr*factor)); nbr=max(1,round(br*factor))
                  f.seek(sr_off); f.write(struct.pack('<I',nsr))
                  f.seek(br_off); f.write(struct.pack('<I',nbr))

          # More Toad-like in spirit: tiny, bright, excited, compressed/raspy energy.
          # Keep American source voices only and avoid exact character imitation.
          configs=[
              ('af_sky',1.11,3.0,None),
              ('af_bella',1.12,3.6,None),
              ('af_jessica',1.105,3.2,None),
              ('blend',1.115,3.4,('af_sky','af_bella',0.62,0.38)),
          ]
          for i,(voice,final_speed,pitch,blend) in enumerate(configs,1):
              factor=2**(pitch/12)
              gen_speed=final_speed/factor
              v=voice
              if blend:
                  a,b,wa,wb=blend
                  v=pipeline.load_voice(a)*wa + pipeline.load_voice(b)*wb
              audio=[]
              for r in pipeline(text,voice=v,speed=gen_speed): audio.extend(r.audio.tolist())
              raw=f'sonoko-puddingchan-r2/raw_{i}.wav'
              out=f'sonoko-puddingchan-r2/SONOKO_PuddingChan_ToadLike_Option_{i}.wav'
              sf.write(raw,audio,24000)
              pitch_wav(raw,out,pitch)
          PY
          rm sonoko-puddingchan-r2/raw_*.wav
      - name: Upload auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-puddingchan-toadlike-round2
          path: sonoko-puddingchan-r2/*.wav
          retention-days: 7
