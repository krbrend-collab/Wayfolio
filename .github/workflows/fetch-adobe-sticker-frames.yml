name: Fetch Adobe Sticker Frames

on:
  push:
    paths:
      - '.github/workflows/fetch-adobe-sticker-frames.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Adobe-cleaned PNG frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adobe_frames
          curl -L --fail --retry 3 -o adobe_frames/frame_001.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:2daac283-9e52-4361-b2cc-78a835ba73ef'
          curl -L --fail --retry 3 -o adobe_frames/frame_002.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:520e179a-1bb3-4d43-95b6-eb4249393908'
          curl -L --fail --retry 3 -o adobe_frames/frame_003.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:eaffbe9f-a78f-44ce-9a7a-822fb11ac9b2'
          file adobe_frames/*
      - name: Upload cleaned frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: img-5385-adobe-cleaned-frames
          path: adobe_frames/
          if-no-files-found: error
          retention-days: 1
