name: SONOKO Enishi clean canonical rebuild

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-enishi-clean-canonical.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate clean Enishi canonical
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-enishi-clean
          python - <<'PY'
          import struct, shutil
          import soundfile as sf
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='a')
          text = (
              "People hold what they can see. It was the same butterfly. "
              "I believed you. It was still belief. Some lights are harder to see when everything else is bright. "
              "You kept watch as far as your light could reach. It was not mine to share. I do too. "
              "I prefer adorable. Mostly is generous."
          )

          # Canonical identity: Round 1 Option 1, am_echo.
          # Original Option 1 was final_speed 0.990, pitch +0.25.
          # The selected refinement raised it another +0.45 semitone.
          # Rebuild directly at the same intended final speed and total +0.70 semitone
          # using generation-speed compensation + WAV header pitch change, avoiding
          # phase-vocoder pitch shifting that can create chorus/doubling artifacts.
          final_speed = 0.990
          pitch = 0.70
          factor = 2**(pitch/12)
          gen_speed = final_speed / factor

          audio = []
          for r in pipeline(text, voice='am_echo', speed=gen_speed):
              audio.extend(r.audio.tolist())

          raw='sonoko-enishi-clean/raw.wav'
          out='sonoko-enishi-clean/SONOKO_Enishi_Canonical_Clean_No_Doubling.wav'
          sf.write(raw, audio, 24000)

          shutil.copyfile(raw, out)
          with open(out,'r+b') as f:
              data=f.read()
              i=data.find(b'fmt ')
              sr_off=i+12
              br_off=i+16
              sr=struct.unpack('<I',data[sr_off:sr_off+4])[0]
              br=struct.unpack('<I',data[br_off:br_off+4])[0]
              f.seek(sr_off); f.write(struct.pack('<I',round(sr*factor)))
              f.seek(br_off); f.write(struct.pack('<I',round(br*factor)))
          PY
          rm sonoko-enishi-clean/raw.wav
      - name: Upload clean Enishi canonical
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-enishi-clean-canonical
          path: sonoko-enishi-clean/*.wav
          retention-days: 7
