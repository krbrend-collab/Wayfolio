name: SONOKO Puchii Distinct Recast Round 3

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-puchii-distinct-recast-r3.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate distinct Puchii recast options
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-puchii-distinct-r3

          python - <<'PY'
          import struct, shutil, subprocess
          import soundfile as sf
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='a')
          TEXT = (
              "Wait, wait, wait—look! "
              "I found it first. That means I get to name it. "
              "No, I already have three names. "
              "Come on! If we're going to do something ridiculous, "
              "we should at least do it quickly."
          )

          # Deliberately avoid af_sky and af_bella, which are central to Pudding-Chan's
          # identity and were also present in the selected Puchii voice.
          OPTIONS = [
              # More boyish / springy, still bright and nasal.
              {"parts":[("af_kore",0.70),("am_liam",0.30)], "speed":1.125, "pitch":2.35,
               "eq":"equalizer=f=1450:t=q:w=1.0:g=2.3,equalizer=f=2300:t=q:w=1.2:g=1.6,equalizer=f=3400:t=q:w=1.2:g=0.8"},
              # Cleaner, chirpier child quality with less compressed texture.
              {"parts":[("af_jessica",0.60),("am_liam",0.40)], "speed":1.135, "pitch":2.20,
               "eq":"equalizer=f=1350:t=q:w=1.0:g=1.8,equalizer=f=2150:t=q:w=1.2:g=1.3,equalizer=f=3250:t=q:w=1.2:g=0.6"},
              # Androgynous, fizzy, youthful; intentionally smoother than Pudding-Chan.
              {"parts":[("af_alloy",0.66),("am_liam",0.34)], "speed":1.135, "pitch":2.55,
               "eq":"equalizer=f=1500:t=q:w=1.0:g=2.0,equalizer=f=2350:t=q:w=1.2:g=1.5,equalizer=f=3500:t=q:w=1.2:g=0.7"},
              # Most distinct: animated boyish core with a brighter upper edge.
              {"parts":[("am_puck",0.58),("af_kore",0.42)], "speed":1.130, "pitch":2.10,
               "eq":"equalizer=f=1400:t=q:w=1.0:g=2.1,equalizer=f=2250:t=q:w=1.2:g=1.4,equalizer=f=3350:t=q:w=1.2:g=0.7"},
          ]

          def blend(parts):
              out = None
              for name, weight in parts:
                  v = pipeline.load_voice(name) * weight
                  out = v if out is None else out + v
              return out

          def pitch_wav(src, dst, semitones):
              shutil.copyfile(src, dst)
              factor = 2**(semitones/12)
              with open(dst, 'r+b') as f:
                  data = f.read()
                  i = data.find(b'fmt ')
                  sr_off = i + 12
                  br_off = i + 16
                  sr = struct.unpack('<I', data[sr_off:sr_off+4])[0]
                  br = struct.unpack('<I', data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack('<I', round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack('<I', round(br*factor)))

          for idx, cfg in enumerate(OPTIONS, 1):
              factor = 2**(cfg["pitch"]/12)
              gen_speed = cfg["speed"] / factor
              voice = blend(cfg["parts"])

              samples = []
              for r in pipeline(TEXT, voice=voice, speed=gen_speed):
                  samples.extend(r.audio.tolist())

              raw = f"sonoko-puchii-distinct-r3/raw_{idx}.wav"
              pitched = f"sonoko-puchii-distinct-r3/pitched_{idx}.wav"
              out = f"sonoko-puchii-distinct-r3/SONOKO_Puchii_Distinct_R3_Option_{idx}.wav"

              sf.write(raw, samples, 24000)
              pitch_wav(raw, pitched, cfg["pitch"])

              filt = cfg["eq"] + ",lowpass=f=9000,alimiter=limit=0.97"
              subprocess.run([
                  "ffmpeg","-y","-loglevel","error","-i",pitched,
                  "-af",filt,"-ar","24000","-ac","1","-c:a","pcm_s16le",out
              ], check=True)

          PY

          rm sonoko-puchii-distinct-r3/raw_*.wav sonoko-puchii-distinct-r3/pitched_*.wav

      - name: Upload Puchii distinct recast options
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-puchii-distinct-r3
          path: sonoko-puchii-distinct-r3/*.wav
          retention-days: 7
