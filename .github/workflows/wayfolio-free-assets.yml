name: Wayfolio Free Asset Collector

on:
  push:
    paths:
      - '.github/workflows/wayfolio-free-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install collector dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Collect free icon packs
        shell: bash
        run: |
          cat > /tmp/collect_wayfolio_assets.py <<'PY'
          import os, re, json, shutil, zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          SOURCES = [
              {
                  'key': '01-alchemy-botanical',
                  'title': '48 Free Alchemy Herbs Vector Icons',
                  'page': 'https://free-game-assets.itch.io/48-free-alchemy-herbs-vector-icons',
                  'expected': 'Alchemy Herbs Vector Icons.zip',
              },
              {
                  'key': '02-crafting-materials',
                  'title': 'Wilderness Survival & Crafting Essentials — 72 Free Icons',
                  'page': 'https://timotty.itch.io/wilderness-survival-crafting-72-icons',
                  'expected': '',
              },
              {
                  'key': '03-fish-aquatic',
                  'title': '2D Free Fish Icons',
                  'page': 'https://voodoomoose.itch.io/2d-free-fish-icons',
                  'expected': 'Free Fish Icons.zip',
              },
              {
                  'key': '04-bugs-arthropods',
                  'title': 'Hand drawn animated 2D Bugs assets',
                  'page': 'https://lionbox.itch.io/bugs-2d-kit',
                  'expected': 'Animated 2D bugs assets.zip',
              },
              {
                  'key': '05-food-cooking',
                  'title': 'Consumables – Fantasy Food & Potions',
                  'page': 'https://worldswithoutend.itch.io/consumables',
                  'expected': 'Consumables.zip',
              },
          ]

          ROOT = Path('wayfolio-free-assets')
          ROOT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Wayfolio-Free-Asset-Collector/1.0'})

          def safe_name(name):
              name = re.sub(r'[\\/:*?"<>|]+', '_', name).strip()
              return name or 'download.bin'

          def save_text(path, text):
              Path(path).write_text(text, encoding='utf-8', errors='ignore')

          def likely_file_links(soup, base):
              out=[]
              for a in soup.find_all('a', href=True):
                  href=urljoin(base,a['href'])
                  text=' '.join(a.stripped_strings)
                  hlow=href.lower(); tlow=text.lower()
                  score=0
                  if any(x in hlow for x in ['.zip','.rar','.7z','/file/','/upload/','download']): score += 2
                  if any(x in tlow for x in ['.zip','.rar','.7z','download']): score += 2
                  if 'itch.io' in urlparse(href).netloc or 'amazonaws.com' in urlparse(href).netloc or 'itch.zone' in urlparse(href).netloc: score += 1
                  if score >= 3:
                      out.append((score,text,href))
              # unique, highest score first
              seen=set(); result=[]
              for item in sorted(out, reverse=True):
                  if item[2] not in seen:
                      seen.add(item[2]); result.append(item)
              return result

          def find_download_page(html, base):
              soup=BeautifulSoup(html,'html.parser')
              # Prefer the explicit zero-dollar bypass link.
              for a in soup.find_all('a', href=True):
                  txt=' '.join(a.stripped_strings).lower()
                  if 'no thanks' in txt and ('download' in txt or 'take me' in txt):
                      return urljoin(base,a['href'])
              # Purchase/download page links.
              for a in soup.find_all('a', href=True):
                  txt=' '.join(a.stripped_strings).lower()
                  href=a['href']
                  if 'download now' in txt or href.endswith('/purchase'):
                      return urljoin(base,href)
              return None

          manifest=[]
          for src in SOURCES:
              dest=ROOT/src['key']
              raw=dest/'_source'
              files=dest/'files'
              raw.mkdir(parents=True,exist_ok=True)
              files.mkdir(parents=True,exist_ok=True)
              rec={**src,'status':'started','downloads':[],'notes':[]}
              try:
                  r=session.get(src['page'],timeout=30)
                  rec['landing_status']=r.status_code
                  rec['landing_final_url']=r.url
                  save_text(raw/'landing.html',r.text)
                  print(f"[{src['key']}] landing {r.status_code} {r.url}")

                  next_url=find_download_page(r.text,r.url)
                  if not next_url:
                      next_url=src['page'].rstrip('/')+'/purchase'
                  rec['purchase_url']=next_url

                  p=session.get(next_url,timeout=30)
                  rec['purchase_status']=p.status_code
                  rec['purchase_final_url']=p.url
                  save_text(raw/'purchase.html',p.text)
                  print(f"[{src['key']}] purchase {p.status_code} {p.url}")

                  # On purchase page, follow explicit free bypass if present.
                  bypass=find_download_page(p.text,p.url)
                  d=p
                  if bypass and bypass != p.url and '/purchase' not in bypass.rstrip('/')[-10:]:
                      print(f"[{src['key']}] bypass candidate {bypass}")
                      d=session.get(bypass,timeout=30)
                      rec['download_page_url']=d.url
                      rec['download_page_status']=d.status_code
                      save_text(raw/'download.html',d.text)
                  else:
                      rec['download_page_url']=p.url
                      rec['download_page_status']=p.status_code
                      save_text(raw/'download.html',p.text)

                  soup=BeautifulSoup(d.text,'html.parser')
                  candidates=likely_file_links(soup,d.url)
                  rec['candidate_links']=[{'text':t,'url':u,'score':s} for s,t,u in candidates[:30]]
                  print(f"[{src['key']}] candidate links: {len(candidates)}")
                  for s,t,u in candidates[:20]:
                      print(f"  score={s} text={t[:100]!r} url={u}")

                  downloaded=False
                  for score,text,url in candidates:
                      # Skip navigation/purchase pages and try likely binary links.
                      if url.rstrip('/') in {src['page'].rstrip('/'), next_url.rstrip('/')}:
                          continue
                      try:
                          rr=session.get(url,timeout=90,allow_redirects=True,stream=True)
                          ctype=(rr.headers.get('content-type') or '').lower()
                          disp=rr.headers.get('content-disposition') or ''
                          final=rr.url
                          is_binary = ('zip' in ctype or 'octet-stream' in ctype or 'application/x-' in ctype or 'attachment' in disp.lower() or final.lower().endswith(('.zip','.rar','.7z')))
                          if not is_binary:
                              # Avoid saving HTML challenge/navigation pages as assets.
                              rr.close(); continue
                          fname=None
                          m=re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)',disp,re.I)
                          if m: fname=m.group(1)
                          if not fname:
                              fname=os.path.basename(urlparse(final).path) or src['expected'] or 'download.bin'
                          fname=safe_name(fname)
                          out=files/fname
                          with open(out,'wb') as f:
                              for chunk in rr.iter_content(1024*1024):
                                  if chunk: f.write(chunk)
                          size=out.stat().st_size
                          if size < 1024:
                              out.unlink(missing_ok=True); continue
                          rec['downloads'].append({'file':fname,'bytes':size,'url':url,'final_url':final,'content_type':ctype})
                          print(f"[{src['key']}] downloaded {fname} ({size} bytes)")
                          downloaded=True
                      except Exception as e:
                          rec['notes'].append(f"candidate failed: {url}: {e}")

                  # Extract downloaded ZIPs while preserving originals.
                  extracted=dest/'extracted'
                  extracted.mkdir(exist_ok=True)
                  for item in list(files.iterdir()):
                      if item.suffix.lower()=='.zip':
                          try:
                              with zipfile.ZipFile(item) as z:
                                  z.extractall(extracted/item.stem)
                              print(f"[{src['key']}] extracted {item.name}")
                          except Exception as e:
                              rec['notes'].append(f"extract failed {item.name}: {e}")

                  rec['status']='downloaded' if downloaded else 'needs-followup'
              except Exception as e:
                  rec['status']='error'; rec['notes'].append(str(e)); print(f"[{src['key']}] ERROR {e}")
              manifest.append(rec)

          (ROOT/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          summary=[]
          for r in manifest:
              summary.append(f"{r['key']}: {r['status']} — {len(r.get('downloads',[]))} files")
          (ROOT/'SUMMARY.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print('\n'.join(summary))
          PY
          python /tmp/collect_wayfolio_assets.py

      - name: Upload collected asset library
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayfolio-free-assets
          path: wayfolio-free-assets/
          if-no-files-found: error
          retention-days: 7
