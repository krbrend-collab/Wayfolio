name: Cleanup Wayfolio Free Asset Collector

on:
  push:
    paths:
      - '.github/workflows/wayfolio-free-assets.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary asset artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for ARTIFACT_ID in 10003293983 10003338204; do
            echo "Deleting artifact $ARTIFACT_ID"
            curl --fail-with-body -sS -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" || true
          done
