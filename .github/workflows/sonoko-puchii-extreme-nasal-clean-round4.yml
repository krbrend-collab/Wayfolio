name: SONOKO Puchii extreme nasal clean round 4

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-puchii-extreme-nasal-clean-round4.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Puchii clean single-voice auditions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile scipy
          mkdir -p sonoko-puchii-r4
          python - <<'PY'
          import struct, shutil
          import numpy as np
          import soundfile as sf
          from scipy.signal import lfilter, butter, sosfilt
          from kokoro import KPipeline

          pipeline=KPipeline(lang_code='a')
          text="Wait—wait, I have an idea! No, a better idea. We should absolutely go that way. Why? Because I already started walking! Come on! If it explodes, we'll know not to do it twice. Probably!"

          def pitch_header(src,dst,semitones):
              shutil.copyfile(src,dst)
              factor=2**(semitones/12)
              with open(dst,'r+b') as f:
                  data=f.read()
                  i=data.find(b'fmt ')
                  sr_off=i+12; br_off=i+16
                  sr=struct.unpack('<I',data[sr_off:sr_off+4])[0]
                  br=struct.unpack('<I',data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack('<I',round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack('<I',round(br*factor)))

          def peak_eq(x,sr,f0,gain_db,Q=1.0):
              A=10**(gain_db/40.0)
              w0=2*np.pi*f0/sr
              alpha=np.sin(w0)/(2*Q)
              b=np.array([1+alpha*A,-2*np.cos(w0),1-alpha*A],float)
              a=np.array([1+alpha/A,-2*np.cos(w0),1-alpha/A],float)
              b/=a[0]; a/=a[0]
              return lfilter(b,a,x)

          def extreme_nasal(path, strength):
              x,sr=sf.read(path)
              if x.ndim>1: x=x.mean(axis=1)
              # strip chest resonance and push forward nasal mask hard
              sos=butter(2,250,btype='highpass',fs=sr,output='sos')
              y=sosfilt(sos,x)
              y=peak_eq(y,sr,450,-6.0,Q=0.9)
              y=peak_eq(y,sr,850,7.0+2.0*strength,Q=0.95)
              y=peak_eq(y,sr,1250,9.0+2.5*strength,Q=1.1)
              y=peak_eq(y,sr,1750,7.0+2.0*strength,Q=1.2)
              y=peak_eq(y,sr,2850,4.0+1.0*strength,Q=1.15)
              y=peak_eq(y,sr,5000,-1.5,Q=1.0)
              # compact, forward, cheerful presence without chorus/doubling
              drive=1.12+0.05*strength
              y=np.tanh(y*drive)/np.tanh(drive)
              peak=np.max(np.abs(y))
              if peak>0: y*=min(0.94/peak,1.0)
              sf.write(path,y,sr)

          # Fresh single-source generations: no phase-vocoder/time-stretch, no layered voices.
          # 1-2 build from original favorite 1 (af_bella), 3-4 from original favorite 3 (af_kore).
          configs=[
              ('af_bella',1.16,2.35,1.10),
              ('af_bella',1.19,2.85,1.45),
              ('af_kore',1.16,2.45,1.10),
              ('af_kore',1.19,2.95,1.45),
          ]

          for i,(voice,final_speed,pitch,nasal_strength) in enumerate(configs,1):
              factor=2**(pitch/12)
              gen_speed=final_speed/factor
              audio=[]
              for r in pipeline(text,voice=voice,speed=gen_speed):
                  audio.extend(r.audio.tolist())
              raw=f'sonoko-puchii-r4/raw_{i}.wav'
              out=f'sonoko-puchii-r4/SONOKO_Puchii_R4_Option_{i}.wav'
              sf.write(raw,audio,24000)
              pitch_header(raw,out,pitch)
              extreme_nasal(out,nasal_strength)
          PY
          rm sonoko-puchii-r4/raw_*.wav
      - name: Upload Puchii auditions
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-puchii-extreme-nasal-clean-round4
          path: sonoko-puchii-r4/*.wav
          retention-days: 7
