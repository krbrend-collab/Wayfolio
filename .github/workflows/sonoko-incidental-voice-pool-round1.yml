name: SONOKO incidental voice pool round 1

on:
  push:
    branches: [sonoko-auditions-host]
    paths: [.github/workflows/sonoko-incidental-voice-pool-round1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate incidental voice pool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install --quiet 'kokoro>=0.9.4' soundfile
          mkdir -p sonoko-incidental-pool-r1
          python - <<'PY'
          import struct, shutil
          import soundfile as sf
          from kokoro import KPipeline

          pipeline = KPipeline(lang_code='a')
          text = (
              "Morning. You're early. "
              "The market won't get busy for another hour. "
              "If you're looking for the festival road, keep left at the bridge. "
              "Someone moved the sign again. Happens every year. "
              "No harm done. You'll find it."
          )

          def pitch_wav(src, dst, semitones):
              shutil.copyfile(src, dst)
              factor = 2**(semitones/12)
              with open(dst, 'r+b') as f:
                  data = f.read()
                  i = data.find(b'fmt ')
                  sr_off = i + 12
                  br_off = i + 16
                  sr = struct.unpack('<I', data[sr_off:sr_off+4])[0]
                  br = struct.unpack('<I', data[br_off:br_off+4])[0]
                  f.seek(sr_off); f.write(struct.pack('<I', round(sr*factor)))
                  f.seek(br_off); f.write(struct.pack('<I', round(br*factor)))

          configs = [
              ("AdultWoman_Warm",      "af_river",  1.020, -0.10),
              ("AdultWoman_Bright",    "af_sarah",  1.035, +0.12),
              ("AdultMan_Friendly",    "am_puck",   1.025, +0.10),
              ("AdultMan_Grounded",    "am_fenrir", 1.010, -0.20),
              ("OlderMan_Grounded",    "am_onyx",   0.985, -0.30),
              ("YoungAdult_Flexible",  "am_adam",   1.045, +0.55),
          ]

          for label, voice, final_speed, pitch in configs:
              factor = 2**(pitch/12)
              gen_speed = final_speed / factor
              audio = []
              for r in pipeline(text, voice=voice, speed=gen_speed):
                  audio.extend(r.audio.tolist())

              raw = f"sonoko-incidental-pool-r1/raw_{label}.wav"
              out = f"sonoko-incidental-pool-r1/SONOKO_Incidental_{label}.wav"
              sf.write(raw, audio, 24000)
              pitch_wav(raw, out, pitch)

          PY
          rm sonoko-incidental-pool-r1/raw_*.wav

      - name: Upload incidental voice pool
        uses: actions/upload-artifact@v4
        with:
          name: sonoko-incidental-voice-pool-round1
          path: sonoko-incidental-pool-r1/*.wav
          retention-days: 7
