<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Wayfolio DM Host</title><link rel="stylesheet" href="/style.css"></head><body data-role="dm"><main class="controls"><div class="eyebrow">Private DM controls · HEMLOCK</div><h1 id="scene-title">The Lantern Road</h1><p id="scene-text">Central campaign authority</p><div id="players" class="status">Waiting for Wayfolios…</div><section id="dm-actions"><h2>Player actions</h2><p class="quiet">Private and public declarations appear here.</p></section><button id="start-encounter">Start: The Motes Beneath the Bridge</button><input id="title-input" value="The Lantern Road"><textarea id="text-input" rows="5">Evening settles over Hemlock Village. Blue motes gather beneath the old bridge.</textarea><button id="publish">Publish custom scene</button><input id="skill" value="Insight" aria-label="Skill"><input id="dc" type="number" value="12" aria-label="Difficulty class"><input id="modifier" type="number" value="3" aria-label="Renn modifier"><button id="prompt">Send custom check</button><section class="audio-controls"><h2>Shared audio</h2><h3>Ambience and music</h3><div class="button-grid"><button data-ambience="hemlock_forest">Forest ambience</button><button data-ambience="hemlock_tavern">Tavern ambience</button><button data-ambience="" class="secondary">Stop ambience</button><button data-music="forest_exploration">Exploration music</button><button data-music="" class="secondary">Stop music</button></div><h3>World effects</h3><div class="button-grid"><button data-sfx="wood_bridge_creak">Bridge creak</button><button data-sfx="footsteps_wood">Wood footsteps</button><button data-sfx="door_latch">Door latch</button><button data-sfx="water_splash">Water splash</button><button data-sfx="dice_roll">Dice roll</button><button data-sfx="spell_chime">Spell chime</button></div><h3>Creature sounds</h3><div class="button-grid"><button data-creature-preset='{"type":"creature_sound","creature_id":"meadow_bunny","creature_type":"beast","body_form":"small_soft_bodied","size":"small","disposition":"timid","behavior":"startle"}'>Timid bunny</button><button data-creature-preset='{"type":"creature_sound","creature_id":"hemlock_wolf","creature_type":"beast","body_form":"large_quadruped","size":"medium","disposition":"predatory","behavior":"warning"}'>Predatory wolf</button><button data-creature-preset='{"type":"creature_sound","creature_id":"glimmer_slime","creature_type":"ooze","body_form":"amorphous","size":"small","disposition":"curious","behavior":"move"}'>Curious slime</button><button data-creature-preset='{"type":"creature_sound","creature_id":"mire_slime","creature_type":"ooze","body_form":"amorphous","size":"large","disposition":"hostile","behavior":"attack"}'>Hostile slime</button><button data-creature-preset='{"type":"creature_sound","creature_id":"well_spirit","creature_type":"undead","body_form":"incorporeal","size":"medium","disposition":"mournful","behavior":"appear"}'>Mournful spirit</button><button data-creature-preset='{"type":"creature_sound","creature_id":"lantern_wraith","creature_type":"undead","body_form":"incorporeal","size":"medium","disposition":"hostile","behavior":"whisper"}'>Hostile spirit</button></div><h3>Dialogue test</h3><select id="speaker-id" aria-label="Speaker"><option value="narrator">Narrator</option><option value="renn">Renn Hazel</option><option value="unknown_voice">Unknown voice</option><option value="koori">Koori</option><option value="maro">Maro</option><option value="amia">Amia</option><option value="pudding_chan">Pudding-Chan</option><option value="enishi">Enishi</option><option value="puchii">Puchii</option></select><input id="performance" value="warm, measured, quietly mysterious" aria-label="Performance"><textarea id="dialogue-text" rows="3">Evening settles over Hemlock Village. Blue motes gather beneath the old bridge.</textarea><button id="speak-dialogue">Speak on shared screen</button><button id="stop-all-aud
