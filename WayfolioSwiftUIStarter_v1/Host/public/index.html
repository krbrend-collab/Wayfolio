<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Wayfolio Shared Adventure</title><link rel="stylesheet" href="/style.css"></head><body data-role="screen"><main><div class="eyebrow">Wayfolio · Session HEMLOCK</div><section class="panel"><h1 id="scene-title">The Lantern Road</h1><p id="scene-text">Evening settles over Hemlock Village. Blue motes gather beneath the old bridge.</p><div id="players" class="status">Waiting for Wayfolios…</div><section id="shared-audio"><div class="audio-heading"><h2>Shared presentation audio</h2><button id="enable-audio">Enable audio</button></div><p id="audio-status" class="quiet">Audio needs one click before the browser can play it.</p><div class="mixer"><label>Voice<input data-bus-volume="voice" type="range" min="0" max="1" step="0.05" value="1"></label><label>Effects<input data-bus-volume="sfx" type="range" min="0" max="1" step="0.05" value="0.9"></label><label>Ambience<input data-bus-volume="ambience" type="range" min="0" max="1" step="0.05" value="0.55"></label><label>Music<input data-bus-volume="music" type="range" min="0" max="1" step="0.05" value="0.5"></label></div></section><aside id="dialogue-caption" hidden></aside><section id="action-panel"><h2>Speak or act</h2><textarea id="action-text" rows="3" placeholder="What is said or done at the table?"></textarea><div class="audience"><button id="action-private" class="secondary">Send privately to DM</button><button id="action-public">Share publicly</button></div><p id="action-status"></p></section><section id="public-actions"></section><section id="roll-panel" hidden><h2>Roll at the table</h2><p id="roll-request"></p><button id="digital-roll">Roll d20 digitally</button><div class="physical"><input id="physical-die" type="number" min="1" max="20" placeholder="Physical d20 result"><button id="physical-roll">Use physical roll</button></div><p id="roll-error"></p></section><p id="result" class="status"></p></section></main><script src="/audio.js"></script><script src="/app.js"></script></body></html>
